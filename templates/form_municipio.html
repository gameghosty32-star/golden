{% extends 'base.html' %}

{% block titulo %}{{ action }} município{% endblock %}

{% block conteudo %}
<div class="auth-card mx-auto" style="max-width: 620px;">
    <div class="auth-header">
        <h2>{{ action }} município</h2>
        <p>Informe os dados e selecione a província.</p>
    </div>
    <form action="" method="post" class="auth-form">
        <div class="mb-3">
            <label for="name" class="form-label">Nome do município</label>
            <input type="text" class="form-control" id="name" name="name" value="{{ municipio.name if municipio else '' }}" required>
        </div>
        <div class="mb-3">
            <label for="description" class="form-label">Descrição</label>
            <textarea class="form-control" id="description" name="description" rows="4">{{ municipio.description if municipio else '' }}</textarea>
        </div>
        <div class="mb-4">
            <label for="population" class="form-label">População (opcional)</label>
            <input type="number" min="0" class="form-control" id="population" name="population" value="{{ municipio.population if municipio and municipio.population is not none else '' }}">
        </div>
        <div class="mb-4">
            <label for="provincia_id" class="form-label">Província</label>
            <select id="provincia_id" name="provincia_id" class="form-select" required>
                <option value="">Selecione uma província</option>
                {% for provincia in provincias %}
                    <option value="{{ provincia.id }}" {% if municipio and municipio.provincia_id == provincia.id %}selected{% endif %}>{{ provincia.name }}</option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="btn btn-dark w-100">{{ action }}</button>
        <a class="btn btn-link mt-3" href="{{ url_for('municipios') }}">Voltar para municípios</a>
    </form>
</div>
{% endblock %}
