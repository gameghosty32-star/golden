<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golden - {% block titulo %}{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style/bootstrap.rtl.min.css' ) }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style/bootstrap.min.css' ) }}">
</head>
<body>
    <header>
        <nav
        class="navbar navbar-expand-md navbar-dark bg-dark"
        aria-label="Fourth navbar example"
      >
        <div class="container-fluid">
          <a class="navbar-brand" href="#">Golden</a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarsExample04"
            aria-controls="navbarsExample04"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarsExample04">
            <ul class="navbar-nav me-auto mb-2 mb-md-0">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="#">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link disabled" aria-disabled="true">User</a>
              </li>
              <li class="nav-item dropdown">
                <a
                  class="nav-link dropdown-toggle"
                  href="#"
                  data-bs-toggle="dropdown"
                  aria-expanded="false"
                  >Provincias</a
                >
                <ul class="dropdown-menu">
                  <li><a class="dropdown-item" href="#">Adicionar</a></li>
                  <li><a class="dropdown-item" href="#">Editar</a></li>
                  <li>
                    <a class="dropdown-item" href="#">Remover</a>
                  </li>
                </ul>
              </li>
            </ul>
            <form role="search">
              <input
                class="form-control"
                type="search"
                placeholder="Search"
                aria-label="Search"
              />
            </form>
          </div>
        </div>
      </nav>
    </header>
    {% block conteudo %}
        
    {% endblock %}

</body>

<script src="{{ url_for('static', filename='script/bootstrap.bundle.min.js' ) }}" defer></script>
</html>
