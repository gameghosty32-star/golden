{% extends 'base.html' %}

{% block titulo %}Login{% endblock %}

{% block conteudo %}
<div class="auth-card mx-auto">
    <div class="auth-header">
        <h2>Login</h2>
        <p>Acesse sua conta para gerenciar o cadastro de locais.</p>
    </div>
    <form action="{{ url_for('login') }}" method="post" class="auth-form">
        <div class="mb-3">
            <label for="email" class="form-label">E-mail</label>
            <input type="email" class="form-control" id="email" name="email" value="{{ email or '' }}" required>
        </div>
        <div class="mb-4">
            <label for="password" class="form-label">Senha</label>
            <input type="password" class="form-control" id="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-dark w-100">Entrar</button>
        <p class="auth-meta">Novo por aqui? <a href="{{ url_for('signup') }}">Crie uma conta</a>.</p>
    </form>
</div>
{% endblock %}
